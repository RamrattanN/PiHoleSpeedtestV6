[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pihole-speedtest-v6"
version = "1.0.6"
description = "Independent speed-test companion for Pi-hole v6"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nilesh Ramrattan" }]
dependencies = []
classifiers = ["License :: OSI Approved :: MIT License"]

[project.scripts]
pihole-speedtest = "pihole_speedtest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pihole_speedtest = ["web/*"]
