name: build

# EXPERIMENTAL - Docker image publication is deferred future work (planned for
# version 1.1.0; see docs/KANBAN.md).  The current Docker assets are not
# production-equivalent, so this workflow never runs from a GitHub Release or
# any other automatic event.  It can only be started by hand with an explicit
# confirmation.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH EXPERIMENTAL IMAGE to publish an experimental image
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH EXPERIMENTAL IMAGE'
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-experimental

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
